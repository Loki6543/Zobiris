name: Export sanitized Zobiris Core
# hardening-audit-trigger: 2026-09-27

on:
  push:
    branches:
      - zobiris-core-rebuild
    paths:
      - ".github/workflows/zobiris-core-export.yml"
      - "tools/export_core_sanitized.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitized source snapshot
        run: python tools/export_core_sanitized.py
      - name: Upload sanitized export
        uses: actions/upload-artifact@v4
        with:
          name: zobiris-core-sanitized-export
          path: |
            Zobiris_Core_Rebuild_Code_Sanitized.md
            Zobiris_Core_Rebuild_Code_Manifest.json
            Zobiris_Core_Rebuild_Sanitization_Report.txt
          if-no-files-found: error
          retention-days: 7
