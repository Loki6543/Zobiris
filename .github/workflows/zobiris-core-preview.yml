name: Zobiris Core Desktop Preview

on:
  push:
    branches:
      - zobiris-core-rebuild
    paths:
      - ".github/workflows/zobiris-core-preview.yml"
      - "core/src/app/**"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop UI
        run: npm run build:ui

      - name: Install Playwright for preview capture
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built UI
        shell: bash
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/zobiris-preview-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zobiris-preview-server.log
          exit 1

