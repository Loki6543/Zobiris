name: Validate Bright Data Investigator

on:
  push:
    branches:
      - feature/brightdata-evidence-investigator-v1

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ZOBIRIS Dockerfile validation
        run: docker build --progress=plain -t zobiris-brightdata-validation .
