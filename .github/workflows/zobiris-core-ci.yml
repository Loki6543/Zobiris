name: Zobiris Core CI

on:
  push:
    branches:
      - zobiris-core-rebuild
  pull_request:
    paths:
      - "core/**"

concurrency:
  group: zobiris-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck, tests and production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../zobiris-core-ci.log
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zobiris-core-ci-log
          path: zobiris-core-ci.log
          if-no-files-found: error
          retention-days: 7
