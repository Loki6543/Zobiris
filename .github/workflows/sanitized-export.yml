name: sanitized-export

on:
  push:
    branches:
      - sanitized-export-2026-10-07

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sanitized export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build sanitized source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sanitized_export ZOBIRIS_SANITIZED_SOURCE_2026-10-07.zip
          mkdir -p sanitized_export

          rsync -a ./ sanitized_export/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude '.cache/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.sqlite' \
            --exclude '*.sqlite3' \
            --exclude '*.db' \
            --exclude '*.pem' \
            --exclude '*.key' \
            --exclude '*.p12' \
            --exclude '*.pfx' \
            --exclude '*.b64' \
            --exclude '*.tgz' \
            --exclude '*.tar' \
            --exclude '*.gz' \
            --exclude '*.xz' \
            --exclude '*.zip' \
            --exclude '*.png' \
            --exclude '*.jpg' \
            --exclude '*.jpeg' \
            --exclude '*.gif' \
            --exclude '*.webp' \
            --exclude '*.woff' \
            --exclude '*.woff2' \
            --exclude '*.ttf' \
            --exclude '*.otf'

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path("sanitized_export")
          text_ext = {
              ".ts",".tsx",".js",".jsx",".mjs",".cjs",".json",".md",".txt",".yml",".yaml",
              ".toml",".ini",".cfg",".css",".html",".sh",".py",".sql",".xml",".csv"
          }

          email_re = re.compile(r'(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b')
          railway_url_re = re.compile(r'https?://[A-Za-z0-9.-]+\.up\.railway\.app(?::\d+)?(?:/[^\s"\'<>]*)?')
          uuid_re = re.compile(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b')
          private_key_re = re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----', re.S)
          token_res = [
              re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              re.compile(r'\bgh[pousr]_[A-Za-z0-9_]{20,}\b'),
              re.compile(r'\bgithub_pat_[A-Za-z0-9_]{20,}\b'),
              re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
              re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
              re.compile(r'\bAIza[0-9A-Za-z_-]{25,}\b'),
          ]
          secret_assignment_re = re.compile(
              r'(?i)(\b(?:api[_-]?key|secret|token|password|passwd|authorization|auth[_-]?token|private[_-]?key)\b\s*[:=]\s*)'
              r'(["\'])(?!<redacted)([^"\'\n]{8,})(\2)'
          )

          redactions = {
              "emails": 0,
              "railway_urls": 0,
              "uuids": 0,
              "private_keys": 0,
              "token_literals": 0,
              "secret_assignments": 0,
          }

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in text_ext and path.name not in {"Dockerfile","Makefile"}:
                  continue
              try:
                  s = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              # Preserve obviously generic/example emails.
              def repl_email(m):
                  v = m.group(0)
                  if v.lower().endswith("@example.com") or v.lower().endswith("@users.noreply.github.com"):
                      return v
                  redactions["emails"] += 1
                  return "<redacted-email>"

              s = email_re.sub(repl_email, s)

              n = len(railway_url_re.findall(s))
              if n:
                  redactions["railway_urls"] += n
                  s = railway_url_re.sub("https://<redacted-railway-host>", s)

              n = len(uuid_re.findall(s))
              if n:
                  redactions["uuids"] += n
                  s = uuid_re.sub("<redacted-uuid>", s)

              n = len(private_key_re.findall(s))
              if n:
                  redactions["private_keys"] += n
                  s = private_key_re.sub("<redacted-private-key>", s)

              for rx in token_res:
                  n = len(rx.findall(s))
                  if n:
                      redactions["token_literals"] += n
                      s = rx.sub("<redacted-token>", s)

              def repl_secret(m):
                  redactions["secret_assignments"] += 1
                  return m.group(1) + m.group(2) + "<redacted-secret>" + m.group(4)

              s = secret_assignment_re.sub(repl_secret, s)
              path.write_text(s, encoding="utf-8")

          # Remove user-specific watchlist membership while retaining schema/example.
          watchlist = root / "deploy/prediction/overrides/src/fixtures/watchlist.json"
          if watchlist.exists():
              watchlist.write_text(json.dumps([
                  {"symbol":"BTC","name":"Bitcoin"},
                  {"symbol":"ETH","name":"Ethereum"},
                  {"symbol":"SOL","name":"Solana"}
              ], indent=2) + "\n", encoding="utf-8")

          snapshot = root / "deploy/prediction/overrides/src/fixtures/watchlist-source-snapshot.json"
          if snapshot.exists():
              snapshot.write_text(json.dumps({
                  "source":"<redacted-user-watchlist-source>",
                  "retrievedAt":None,
                  "version":"sanitized-example",
                  "importMethod":"User-specific watchlist metadata removed from sanitized export.",
                  "orderedMembership":["BTC","ETH","SOL"]
              }, indent=2) + "\n", encoding="utf-8")

          # Remove files whose purpose is runtime/private account state rather than source interface.
          for rel in [
              "data",
              "runtime-data",
              "private",
              "secrets",
          ]:
              p = root / rel
              if p.exists() and p.is_dir():
                  import shutil
                  shutil.rmtree(p)

          report = root / "SANITIZATION_REPORT.md"
          report.write_text(
              "# ZOBIRIS Sanitized Source Export\n\n"
              "Source checkpoint: af9b9974ea18ddf1891e65de7c1568129229fb8a\n\n"
              "Generated for safe code sharing. This package intentionally removes or redacts private/runtime information.\n\n"
              "## Excluded\n"
              "- Git metadata and GitHub workflow metadata\n"
              "- Internal docs/research notes\n"
              "- Environment files and runtime databases\n"
              "- Encoded archives and binary/media assets\n"
              "- Private-key/certificate formats\n"
              "- User-specific watchlist membership (replaced with BTC/ETH/SOL example)\n\n"
              "## Redacted in text source\n"
              "- Personal email addresses\n"
              "- Railway hosted URLs\n"
              "- UUID-like infrastructure identifiers\n"
              "- Common API/token/private-key literal formats\n"
              "- Literal assignments to secret/token/password/API-key fields\n\n"
              "Environment-variable *names* and code paths that read secrets are retained because they are part of the software interface.\n\n"
              "Redaction counts: " + json.dumps(redactions, sort_keys=True) + "\n",
              encoding="utf-8"
          )
          PY

          # Fail closed if common secret forms survived.
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path("sanitized_export")
          checks = {
              "private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(r"\b(?:gh[pousr]_|github_pat_)[A-Za-z0-9_]{20,}\b"),
              "Slack token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
              "OpenAI-style token": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "Railway hosted URL": re.compile(r"https?://[A-Za-z0-9.-]+\.up\.railway\.app"),
          }
          problems = []
          for p in root.rglob("*"):
              if not p.is_file() or p.stat().st_size > 5_000_000:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for label, rx in checks.items():
                  if rx.search(s):
                      problems.append(f"{label}: {p}")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("Sanitization scan passed.")
          PY

          (
            cd sanitized_export
            zip -qr ../ZOBIRIS_SANITIZED_SOURCE_2026-10-07.zip .
          )

      - name: Upload sanitized source
        uses: actions/upload-artifact@v4
        with:
          name: ZOBIRIS_SANITIZED_SOURCE_2026-10-07
          path: ZOBIRIS_SANITIZED_SOURCE_2026-10-07.zip
          if-no-files-found: error
          retention-days: 7
